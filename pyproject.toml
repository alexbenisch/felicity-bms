[project]
name = "felicity"
version = "0.1.0"
description = "Felicity BMS Data Reader - Reads battery management system data via serial"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyserial>=3.5",
    "paho-mqtt>=1.6.1",
    "python-dotenv>=1.0.0",
]

[project.scripts]
felicity = "main:main"
